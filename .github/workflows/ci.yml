name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    # POETRY_SYSTEM_GIT_CLIENT forces Poetry to shell out to /usr/bin/git
    # instead of using its bundled dulwich client - so git's insteadOf
    # rewriting (set below) actually takes effect on VCS dependencies.
    env:
      POETRY_SYSTEM_GIT_CLIENT: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.python }}-
      - name: Install dependencies (runtime + dev)
        run: poetry install --with dev --no-interaction --no-ansi
      - name: Run tests
        run: poetry run pytest -v --tb=short

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      # `ruff check` is clean across src/, tests/ and scripts/, so it now
      # blocks - a new lint error should fail the build rather than scroll by.
      - name: Ruff check
        run: ruff check src/ tests/ scripts/ .github/scripts/
      # The tree was reformatted wholesale, so this blocks too. It drops the
      # old aligned-assignment style; `ruff format` is now the single arbiter
      # rather than a per-file judgement call.
      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/ .github/scripts/

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install lint group
        run: poetry install --only lint --no-interaction --no-ansi
      # -r is load-bearing: pymarkdown's `scan` does NOT recurse into
      # directories, so without it this job read only docs/index.md and
      # skipped every subdirectory - passing on a near-empty scan.
      - name: Scan markdown
        run: poetry run pymarkdown --config pyproject.toml scan -r README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md docs/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      # The `docs` group holds zensical, and the SDK is not needed to render
      # the site, so this installs that group alone and never fetches the SDK.
      - name: Install docs dependencies
        run: poetry install --only docs --no-interaction --no-ansi
      # Build the site so a broken zensical.toml fails here, not on publish.
      # (`--strict` exists but is documented as "currently unsupported", so
      # it is deliberately not used.)
      - name: Build docs
        run: poetry run zensical build
      # A successful build is not enough on its own. Zensical reads `[project]`
      # and silently DISCARDS every other top-level table, so a mis-nested
      # section is not an error - it is a setting that quietly stops applying,
      # and the build still passes. That is exactly how the theme and
      # markdown_extensions config sat dead in this repo. These assertions pin
      # the settings that would otherwise fail invisibly.
      - name: Verify config actually applied
        run: |
          set -euo pipefail
          fail() { echo "::error title=Docs config not applied::$1"; exit 1; }
          grep -q 'data-md-color-primary="custom"' site/index.html \
            || fail "custom palette missing - is [project.theme.palette] nested correctly?"
          grep -q 'md-tabs__item' site/index.html \
            || fail "navigation tabs missing - is [project.theme].features nested correctly?"
          grep -q 'assets/stylesheets/theme.css' site/index.html \
            || fail "extra_css not linked - is [project].extra_css nested correctly?"
          test -s site/search.json \
            || fail "search index missing or empty - is [project.plugins.search] nested correctly?"
          echo "docs config verified: palette, tabs, extra_css and search index all present"
