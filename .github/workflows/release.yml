name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      # A tag that disagrees with the packaged version produces a release
      # whose artifacts are named after a different version than the tag -
      # and on PyPI the filename wins, so v1.0.1 would publish 1.0.0 and the
      # real 1.0.1 could never be uploaded. Catch it before anything is built.
      - name: Verify tag matches the packaged version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(poetry version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} implies ${tag}, but pyproject.toml says ${pkg}. Bump the version or retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${pkg}"
      - name: Build sdist + wheel
        run: poetry build
      # PyPI rejects a distribution whose metadata carries a direct URL
      # reference (`name @ git+https://...`), in dependencies or in any extra.
      # `twine check` does not look at this - it only renders the README - so
      # the check is explicit. Failing here beats failing after the GitHub
      # release has already been published.
      # PyPI rejects a distribution whose metadata carries a direct URL
      # reference (`name @ git+https://...`), in dependencies or in any extra.
      # `twine check` does not look at this - it only renders the README - so
      # the check is explicit. Failing here beats failing after the GitHub
      # release has already been published.
      - name: Check distribution metadata
        run: |
          set -euo pipefail
          pipx install twine
          twine check dist/*
          python3 .github/scripts/check_no_direct_urls.py dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      # Notes come from the CHANGELOG section for this version, not from the
      # commit log: the history was squashed for the public release, so a log
      # range would render the first release as a single line.
      - name: Generate release notes
        id: notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/scripts/release_notes.sh "$GITHUB_REF_NAME" > notes.md
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "notes: $(wc -l < notes.md) lines"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          files: dist/*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Off until the PyPI Trusted Publisher exists: set the repository variable
    # PUBLISH_TO_PYPI to `true` to switch it on. Without this, the very first
    # tag produces a red release run for a missing publisher, even though the
    # build and the GitHub release both succeeded.
    if: vars.PUBLISH_TO_PYPI == 'true'
    # Authentication takes whichever of the two is configured:
    #   - An API token in the PYPI_API_TOKEN secret, which wins when set
    #     (`gh secret set PYPI_API_TOKEN`).
    #   - Otherwise Trusted Publishing (OIDC): PyPI mints a short-lived token
    #     from this workflow's identity and nothing is stored in the
    #     repository. It needs a publisher registered against owner
    #     `Infoblox-PS`, repository `ibcli`, workflow `release.yml`,
    #     environment `pypi`, or the upload fails with "invalid-publisher".
    #
    # Neither one decides who OWNS the project. PyPI assigns ownership to
    # whoever creates it, and an upload to a name that does not exist creates
    # it under the uploading account. For `ibcli` to belong to the InfobloxPS
    # organisation, the project must be created from that organisation's
    # Projects page BEFORE the first upload - otherwise it lands in a personal
    # account and has to be transferred back afterwards.
    environment:
      name: pypi
      url: https://pypi.org/p/ibcli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      # An empty password falls through to Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
