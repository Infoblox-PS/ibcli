name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      # A tag that disagrees with the packaged version produces a release
      # whose artifacts are named after a different version than the tag -
      # and on PyPI the filename wins, so v1.0.1 would publish 1.0.0 and the
      # real 1.0.1 could never be uploaded. Catch it before anything is built.
      - name: Verify tag matches the packaged version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(poetry version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} implies ${tag}, but pyproject.toml says ${pkg}. Bump the version or retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${pkg}"
      - name: Build sdist + wheel
        run: poetry build
      # PyPI rejects a distribution whose metadata carries a direct URL
      # reference (`name @ git+https://...`), in dependencies or in any extra.
      # `twine check` does not look at this - it only renders the README - so
      # the check is explicit. Failing here beats failing after the GitHub
      # release has already been published.
      # PyPI rejects a distribution whose metadata carries a direct URL
      # reference (`name @ git+https://...`), in dependencies or in any extra.
      # `twine check` does not look at this - it only renders the README - so
      # the check is explicit. Failing here beats failing after the GitHub
      # release has already been published.
      - name: Check distribution metadata
        run: |
          set -euo pipefail
          pipx install twine
          twine check dist/*
          python3 .github/scripts/check_no_direct_urls.py dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Notes come from the CHANGELOG section for this version, not from the
      # commit log: the history was squashed for the public release, so a log
      # range would render the first release as a single line.
      - name: Generate release notes
        id: notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/scripts/release_notes.sh "$GITHUB_REF_NAME" > notes.md
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "notes: $(wc -l < notes.md) lines"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          files: dist/*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI mints a short-lived token from this workflow's
    # OIDC identity, so there is no API token to store or rotate. It requires a
    # matching publisher on PyPI (project `ibcli`, owner `Infoblox-PS`, repo
    # `ibcli`, workflow `release.yml`, environment `pypi`) - configure that
    # first, or this job fails with "invalid-publisher".
    environment:
      name: pypi
      url: https://pypi.org/p/ibcli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
